# Builds the profile stats cards and publishes them
# to the "output" branch used by the README.

name: Update stats cards

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - .github/workflows/stats-cards.yml
      - .github/scripts/resize_card.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: output
          UTC_OFFSET: -3

      - name: Resize commits-by-hour card
        run: |
          git fetch origin main --depth 1
          git show origin/main:.github/scripts/resize_card.py > /tmp/resize_card.py
          git pull origin output
          python3 /tmp/resize_card.py \
            profile-summary-card-output/dracula/4-productive-time.svg \
            profile-summary-card-output/dracula/4-productive-time-wide.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/dracula/4-productive-time-wide.svg
          git diff --cached --quiet || git commit -m "Update commits-by-hour card"
          git push origin HEAD:output
