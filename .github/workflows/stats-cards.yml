# Gera os cards de estatísticas do perfil (todos no mesmo tamanho)
# e publica na branch "output", que o README usa.

name: Atualizar cards de estatísticas

on:
  schedule:
    - cron: "0 */12 * * *"   # atualiza a cada 12 horas
  workflow_dispatch:          # permite rodar manualmente pela aba Actions
  push:
    branches: [main]
    paths:
      - .github/workflows/stats-cards.yml
      - .github/scripts/resize_card.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: output
          UTC_OFFSET: -3

      - name: Ajustar tamanho do card de horários
        run: |
          git fetch origin main --depth 1
          git show origin/main:.github/scripts/resize_card.py > /tmp/resize_card.py
          git pull origin output
          python3 /tmp/resize_card.py \
            profile-summary-card-output/dracula/4-productive-time.svg \
            profile-summary-card-output/dracula/4-productive-time-wide.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/dracula/4-productive-time-wide.svg
          git diff --cached --quiet || git commit -m "Atualiza card de horários"
          git push origin HEAD:output
